<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120">
  <defs>
    <linearGradient id="fo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0ddd0"/>
      <stop offset="50%" stop-color="#dcc4b0"/>
      <stop offset="100%" stop-color="#c4a890"/>
    </linearGradient>
    <linearGradient id="fm" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#f5e8de"/>
      <stop offset="50%" stop-color="#e8d4c4"/>
      <stop offset="100%" stop-color="#d0b8a0"/>
    </linearGradient>
    <linearGradient id="fc" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#faf0e8"/>
      <stop offset="50%" stop-color="#f0ddd0"/>
      <stop offset="100%" stop-color="#dcc4b0"/>
    </linearGradient>
  </defs>

  <!-- 11 thick overlapping feathers, drawn back-to-front (outer first, center last) -->
  <!-- Each feather is wide with a rounded tip and visible edge -->

  <!-- Feather 1 (far left) -->
  <path d="M70 86 Q36 80 6 64 Q0 58 4 50 Q8 48 14 52 Q20 56 26 62 Q50 74 70 86Z"
        fill="url(#fo)" stroke="#b8a088" stroke-width="0.5"/>
  <!-- Feather 11 (far right) -->
  <path d="M70 86 Q104 80 134 64 Q140 58 136 50 Q132 48 126 52 Q120 56 114 62 Q90 74 70 86Z"
        fill="url(#fo)" stroke="#b8a088" stroke-width="0.5"/>

  <!-- Feather 2 -->
  <path d="M70 86 Q34 70 10 40 Q5 33 9 28 Q13 27 17 32 Q22 38 28 46 Q48 66 70 86Z"
        fill="url(#fo)" stroke="#b8a088" stroke-width="0.5"/>
  <!-- Feather 10 -->
  <path d="M70 86 Q106 70 130 40 Q135 33 131 28 Q127 27 123 32 Q118 38 112 46 Q92 66 70 86Z"
        fill="url(#fo)" stroke="#b8a088" stroke-width="0.5"/>

  <!-- Feather 3 -->
  <path d="M70 86 Q38 60 18 24 Q14 16 18 12 Q23 12 26 18 Q30 26 36 36 Q52 58 70 86Z"
        fill="url(#fm)" stroke="#b8a088" stroke-width="0.5"/>
  <!-- Feather 9 -->
  <path d="M70 86 Q102 60 122 24 Q126 16 122 12 Q117 12 114 18 Q110 26 104 36 Q88 58 70 86Z"
        fill="url(#fm)" stroke="#b8a088" stroke-width="0.5"/>

  <!-- Feather 4 -->
  <path d="M70 86 Q46 52 32 12 Q30 4 34 1 Q39 0 41 6 Q44 14 48 26 Q58 52 70 86Z"
        fill="url(#fm)" stroke="#b8a088" stroke-width="0.5"/>
  <!-- Feather 8 -->
  <path d="M70 86 Q94 52 108 12 Q110 4 106 1 Q101 0 99 6 Q96 14 92 26 Q82 52 70 86Z"
        fill="url(#fm)" stroke="#b8a088" stroke-width="0.5"/>

  <!-- Feather 5 -->
  <path d="M70 86 Q56 48 50 6 Q49 -2 54 -3 Q59 -2 60 4 Q61 14 63 28 Q66 52 70 86Z"
        fill="url(#fc)" stroke="#b8a088" stroke-width="0.5"/>
  <!-- Feather 7 -->
  <path d="M70 86 Q84 48 90 6 Q91 -2 86 -3 Q81 -2 80 4 Q79 14 77 28 Q74 52 70 86Z"
        fill="url(#fc)" stroke="#b8a088" stroke-width="0.5"/>

  <!-- Feather 6 (center, on top) -->
  <path d="M70 86 Q66 44 66 2 Q67 -4 70 -5 Q73 -4 74 2 Q74 44 70 86Z"
        fill="url(#fc)" stroke="#b8a088" stroke-width="0.5"/>

  <!-- Quill veins (drawn on top of all feathers) -->
  <g stroke="#b8967a" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M70 86 Q38 78 9 56"/>
    <path d="M70 86 Q36 68 13 34"/>
    <path d="M70 86 Q40 58 22 18"/>
    <path d="M70 86 Q48 50 37 7"/>
    <path d="M70 86 Q58 46 55 2"/>
    <path d="M70 86 L70 -2"/>
    <path d="M70 86 Q82 46 85 2"/>
    <path d="M70 86 Q92 50 103 7"/>
    <path d="M70 86 Q100 58 118 18"/>
    <path d="M70 86 Q104 68 127 34"/>
    <path d="M70 86 Q102 78 131 56"/>
  </g>

  <!-- Handle -->
  <line x1="70" y1="86" x2="70" y2="112" stroke="#8B7355" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Handle binding -->
  <rect x="66.5" y="87" width="7" height="5" rx="1.5" fill="#c9a84c"/>
  <line x1="67" y1="88.5" x2="73" y2="88.5" stroke="#a08030" stroke-width="0.5"/>
  <line x1="67" y1="90" x2="73" y2="90" stroke="#a08030" stroke-width="0.5"/>
  <!-- Tassel -->
  <circle cx="70" cy="114" r="2" fill="#c9a84c"/>
  <path d="M68 115 Q66 118 65 120" stroke="#c0392b" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M70 116 Q70 119 70 120" stroke="#c0392b" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M72 115 Q74 118 75 120" stroke="#c0392b" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
